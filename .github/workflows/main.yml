name: main
on:
 workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: krdlab/setup-haxe@v1.5.1
        with:
          haxe-version: 4.3.6
      - name: run libraries from haxe
        run: |
          haxelib git hxcpp https://github.com/mcagabe19-stuff/hxcpp --quiet
          haxelib git lime https://github.com/mcagabe19-stuff/lime --quiet
          haxelib install openfl 9.3.3 --quiet
          haxelib git flixel https://github.com/MobilePorting/flixel 5.6.1 --quiet
          haxelib git flixel-ui --quiet
          haxelib install flixel-addons 3.2.2 --quiet
          haxelib install flixel-tools 1.5.1 --quiet
          haxelib install hscript --quiet
          haxelib git faxe https://github.com/uhrobots/faxe
          haxelib install polymod 1.3.1
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git extension-webm https://github.com/Sirox228/extension-webm
          haxelib git extension-androidtools https://github.com/idktrolled/extension-androidtools
          haxelib run lime rebuild extension-webm
          haxelib git linc_luajit https://github.com/MasterEric/linc_luajit
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib run lime rebuild hxcpp
          haxelib install actuate 
          haxelib list
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_arm64
          haxelib run lime config ANDROID_SETUP true
      - name: compile
        run: haxelib run lime build android
      - uses: actions/upload-artifact@main
        with:
          name: ke build
          path: export/release/android/bin/app/build/outputs/apk/debug
