name: main
on:
 workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@main
      - name: download setup haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6
      - name: run libraries from haxe
        run: |
          haxelib install lime
          haxelib install openfl
          haxelib install flixel
          haxelib install flixel-ui
          haxelib install flixel-addons
          haxelib install flixel-tools
          haxelib install hscript
          haxelib git faxe https://github.com/uhrobots/faxe
          haxelib install polymod 1.3.1
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc
          haxelib git extension-webm https://github.com/Sirox228/extension-webm
          haxelib git extension-androidtools https://github.com/idktrolled/extension-androidtools
          haxelib git linc_luajit https://github.com/MasterEric/linc_luajit
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib run lime rebuild hxcpp
          haxelib install actuate
      - name: configure android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME_17_X64
          haxelib run lime config ANDROID_SETUP true
      - name: compile
        run: haxelib run lime build android
      - uses: actions/upload-artifact@main
        with:
          name: ke build
          path: export/release/android/bin/app/build/outputs/apk/debug
